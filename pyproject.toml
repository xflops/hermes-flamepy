[project]
name = "hermes-flamepy"
version = "0.3.2"
description = "Hermes terminal backend backed by Flame's persistent sandboxes."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "flamepy>=0.7.0",
    "filelock>=3.16,<4",
]

[project.optional-dependencies]
test = ["pytest", "pylint", "ruamel.yaml", "psutil", "httpx", "python-dotenv"]

[project.entry-points."hermes_agent.plugins"]
hermes-flamepy = "hermes_flamepy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pylint.messages_control]
disable = [
    "import-error",
    "no-name-in-module",
    "import-outside-toplevel",
    "broad-exception-caught",
    "unused-import",
]

[tool.pylint.format]
max-line-length = 120
