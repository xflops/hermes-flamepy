[project]
name = "hermes-flamepy"
version = "0.2.0"
description = "Hermes plugin providing Flame Python SDK backed tools."
requires-python = ">=3.10"
dependencies = [
    "flamepy>=0.7.0"
]

[project.optional-dependencies]
test = ["pytest", "pylint"]

[project.entry-points."hermes_agent.plugins"]
hermes-flamepy = "hermes_flamepy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.pylint.messages_control]
disable = [
    "import-error",
    "no-name-in-module",
    "import-outside-toplevel",
    "broad-exception-caught",
    "unused-import",
]

[tool.pylint.format]
max-line-length = 120
