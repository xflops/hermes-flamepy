[project]
name = "hermes-flamepy"
version = "0.1.0"
description = "Hermes plugin providing Flame Python SDK backed tools."
requires-python = ">=3.10"
dependencies = [
    "flamepy"
]

[project.optional-dependencies]
test = ["pytest"]

[project.entry-points."hermes_agent.plugins"]
hermes-flamepy = "hermes_flamepy"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
