name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run pylint
        run: uv run pylint hermes_flamepy

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Check out Hermes terminal API reference
        uses: actions/checkout@v4
        with:
          repository: NousResearch/hermes-agent
          ref: 31ce88f86e6cf4a66ef6aa315e4657a31bcf9915
          path: .hermes-test-reference
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests
        env:
          HERMES_AGENT_PATH: ${{ github.workspace }}/.hermes-test-reference
        run: uv run pytest tests/ -v
